[build]
  command = "npm run install-all && npm run build"
  publish = "sepsisguard-react/dist"
  functions = "sepsisguard-react/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

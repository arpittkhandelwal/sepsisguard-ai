<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SepsisGuard AI - Early Sepsis Prediction System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fcf8fa;
      }
      .clinical-gradient { background: radial-gradient(circle at 50% 50%, rgba(211, 228, 254, 0.2) 0%, rgba(255, 255, 255, 0) 100%); }
      
      .critical-pulse {
        animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-border {
        0%, 100% { border-color: #ba1a1a; }
        50% { border-color: rgba(186, 26, 26, 0.3); }
      }
      
      .waveform-bg {
        background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
        background-size: 20px 20px;
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

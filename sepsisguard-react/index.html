              secondary: "#505f76",
              "surface-variant": "#e4e2e4",
              "surface-bright": "#fcf8fa",
              "on-secondary-container": "#54647a",
              "on-primary-fixed-variant": "#3f465c",

              outline: "#76777d",
              "on-secondary": "#ffffff",

              "surface-container": "#f0edef",
              "surface-container-lowest": "#ffffff",

              "secondary-fixed-dim": "#b7c8e1",
              "secondary-container": "#d0e1fb",
              "on-tertiary-fixed-variant": "#574425",
              "on-tertiary-container": "#98805d",

              primary: "#000000",
              "tertiary-container": "#271901",

            borderRadius: {

              "label-caps": ["Inter", "sans-serif"],
            },
            fontSize: {
              "data-mono": ["14px", { lineHeight: "1.5", fontWeight: "500" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-lg": ["24px", { lineHeight: "32px", fontWeight: "600" }],

    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fcf8fa;
      }
      .clinical-gradient { background: radial-gradient(circle at 50% 50%, rgba(211, 228, 254, 0.2) 0%, rgba(255, 255, 255, 0) 100%); }
      
      .critical-pulse {
        animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-border {
        0%, 100% { border-color: #ba1a1a; }
        50% { border-color: rgba(186, 26, 26, 0.3); }
      }
      
      .waveform-bg {
        background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
        background-size: 20px 20px;
      }
    </style>

  <body class="bg-surface text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
